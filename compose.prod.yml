name: instatic-prod

services:
  app:
    image: ${INSTATIC_IMAGE:-ghcr.io/corebunch/instatic:latest}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3001}:3001"
    environment:
      PORT: "3001"
      # The app is a Convex client — it reaches its data layer over HTTP at the
      # self-hosted Convex backend, which is deployed separately (its own
      # compose at convex/compose.selfhosted.yml). See docs/DEPLOY-CONVEX.md.
      CONVEX_SELF_HOSTED_URL: ${CONVEX_SELF_HOSTED_URL:-}
      CONVEX_SELF_HOSTED_ADMIN_KEY: ${CONVEX_SELF_HOSTED_ADMIN_KEY:-}
      UPLOADS_DIR: /app/uploads
      STATIC_DIR: /app/dist
      INSTATIC_SECRET_KEY: ${INSTATIC_SECRET_KEY:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "bun", "run", "server/healthcheck.ts"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  uploads:
